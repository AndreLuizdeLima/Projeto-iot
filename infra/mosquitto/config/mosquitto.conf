persistence true
persistence_location /mosquitto/data/
log_dest stdout
max_packet_size 65536
max_queued_messages 10000
per_listener_settings false
allow_anonymous false
password_file /tmp/mosquitto-auth/passwords
acl_file /tmp/mosquitto-auth/acl

# Interno à rede Docker, sem publicação no host.
listener 1883
protocol mqtt

# Entrada pública para o dispositivo. Certificados provisionados no servidor.
listener 8883
protocol mqtt
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
