name: projeto-iot
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:4173:4173'
    security_opt: [no-new-privileges:true]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ORIGIN: ${APP_ORIGIN:?Defina APP_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:?Defina BOOTSTRAP_SECRET}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      IOT_DEVICE_ID: ${IOT_DEVICE_ID:?Defina IOT_DEVICE_ID}
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:?Defina MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Defina MQTT_PASSWORD}
      COMMAND_RESPONSE_TIMEOUT_SECONDS: ${COMMAND_RESPONSE_TIMEOUT_SECONDS:-15}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt: [no-new-privileges:true]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
      - '10.10.10.1:5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
  mosquitto:
    image: eclipse-mosquitto:2.0
    entrypoint: [/bin/sh, /mosquitto-start.sh]
    command: [/mosquitto/config/mosquitto.conf]
    restart: unless-stopped
    ports:
      - '8883:8883'
    volumes:
      - ./infra/mosquitto/start.sh:/mosquitto-start.sh:ro
      - ./infra/mosquitto/config:/mosquitto/config:ro
      - ./infra/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
    security_opt: [no-new-privileges:true]
volumes:
  postgres_data:
  mosquitto_data:
